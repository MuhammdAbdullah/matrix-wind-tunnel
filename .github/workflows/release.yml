name: Build and Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            script: build-win
          - os: macos-latest
            script: build-mac
          - os: ubuntu-latest
            script: build-linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Linux native build dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libudev-dev libusb-1.0-0-dev
      - run: npm ci
      - run: npm run ${{ matrix.script }}
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.os }}
          path: |
            dist/*.exe
            dist/*.dmg
            dist/*.zip
            dist/*.AppImage
            dist/*.deb
            dist/*.yml
            dist/*.blockmap
          if-no-files-found: error

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          name: Wind Tunnel ${{ github.ref_name }}
          files: |
            artifacts/*
            docs/99-wind-tunnel.rules
          body: |
            Matrix Wind Tunnel ${{ github.ref_name }} for Windows, macOS and Linux.

            - **Windows**: `Wind-Tunnel-Setup-*-win-x64.exe`
            - **macOS**: `.dmg` (x64 / arm64). Builds are unsigned: right-click > Open the first time.
            - **Linux**: `.AppImage` or `.deb`. Install `99-wind-tunnel.rules` to /etc/udev/rules.d/ (see comments in the file) so the USB controller is accessible.
